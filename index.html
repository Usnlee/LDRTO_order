            <button id="tab-admin" onclick="switchTab('admin')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-600 hover:text-pink-600">我付錢</button>
        </div>

        <div id="section-order" class="bg-white rounded-2xl shadow-xl p-6 border border-pink-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">填寫您的點餐內容</h2>

            <form id="orderForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- 姓名 -->

                    <label class="block text-xs font-semibold text-gray-600 mb-1">同仁姓名 <span class="text-red-500">*</span></label>
                    <select id="colleague-select" onchange="handleColleagueChange()" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
                        <option value="" disabled selected>請選擇您的姓名...</option>
                    </select>
                    <input type="text" id="custom-name-input" placeholder="請輸入您的姓名" class="mt-2 w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none hidden">
                </div>

                <!-- 飲品品項 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">飲品品項 <span class="text-red-500">*</span></label>
                    <select id="drink-select" onchange="handleDrinkChange()" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
                        <option value="" disabled selected>請選擇飲品...</option>
                    </select>
                </div>

                <!-- 規格 (L/M) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">規格 <span class="text-red-500">*</span></label>
                    <select id="size-select" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
                        <option value="" disabled selected>請先選擇飲品...</option>
                    </select>
                </div>

                <!-- 甜度 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">甜度 <span class="text-red-500">*</span></label>
                    <select id="sweetness-select" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
                        <option value="" disabled selected>請先選擇飲品...</option>
                    </select>
                </div>

                <!-- 冰塊 / 溫度 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">冰塊 / 溫度 <span class="text-red-500">*</span></label>
                    <select id="ice-temp-select" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none" required>
                        <option value="" disabled selected>請先選擇飲品...</option>
                    </select>
                </div>

                <!-- 加料區 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">加料區 (選填)</label>
                    <select id="topping-select" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none">
                        <option value="none">無加料 (+$0)</option>
                        <option value="bobo">波霸 / 小珍珠 / 混珠 (+$5)</option>

                        <option value="foam">奶蓋 / 芝士奶蓋 [限奶蓋/芝士系列] (+$15)</option>

                    <div class="text-xs text-gray-500">總訂購人數</div>
                    <div id="stat-people" class="text-lg font-bold text-pink-600 mt-1">0</div>
                </div>
                <div class="bg-pink-50 p-3 rounded-xl text-center border border-pink-100">
                    <div class="text-xs text-gray-500">總杯數</div>
                    <div id="stat-cups" class="text-lg font-bold text-pink-600 mt-1">0</div>
                </div>
                <div class="bg-pink-50 p-3 rounded-xl text-center border border-pink-100">

                    <div id="stat-total" class="text-lg font-bold text-pink-600 mt-1">$0</div>

                            <th class="p-2.5">甜冰/加料</th>
                            <th class="p-2.5">備註</th>
                            <th class="p-2.5 text-right">金額</th>
                            <th class="p-2.5 text-right">自費差額</th>
                            <th class="p-2.5 text-center">操作</th>

                    </thead>

                        <!-- 動態生成 -->

                </table>
            </div>

            </div>
        </div>
    </div>

                btnOrder.className = "flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-600 hover:text-pink-600";
                secAdmin.classList.remove('hidden');
                secOrder.classList.add('hidden');
                renderAdminTable();
            }
        }

        function handleColleagueChange() {
            const val = document.getElementById('colleague-select').value;
            const customInput = document.getElementById('custom-name-input');
            if (val === "自訂輸入 (其他同仁)") {
                customInput.classList.remove('hidden');
                customInput.required = true;
            } else {
                customInput.classList.add('hidden');
                customInput.required = false;
                customInput.value = '';
            }
        }

        function handleDrinkChange() {
            const drinkName = document.getElementById('drink-select').value;
            const drink = menuData.find(d => d.name === drinkName);
            if (!drink) return;

            const sizeSelect = document.getElementById('size-select');
            sizeSelect.innerHTML = '<option value="" disabled selected>請選擇規格...</option>';
            Object.keys(drink.prices).forEach(size => {
                const opt = document.createElement('option');
                opt.value = size;
                opt.textContent = `${size} (${drink.prices[size]}元)`;
                sizeSelect.appendChild(opt);
            });

            const sweetSelect = document.getElementById('sweetness-select');
            sweetSelect.innerHTML = '<option value="" disabled selected>請選擇甜度...</option>';
            const sweets = drink.fixedSweet ? ["正常甜"] : ["無糖", "微糖", "半糖", "少糖", "正常甜"];
            sweets.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sweetSelect.appendChild(opt);
            });
            if (drink.fixedSweet) sweetSelect.value = "正常甜";

            const iceSelect = document.getElementById('ice-temp-select');
            iceSelect.innerHTML = '<option value="" disabled selected>請選擇冰塊溫度...</option>';
            let ices = [];
            if (drink.fixedIce) {
                ices = ["正常冰"];
            } else {
                ices = ["正常冰", "少冰", "微冰", "去冰", "常溫", "溫"];
                if (drink.hasHot) {
                    ices.push("熱");
                }
            }
            ices.forEach(i => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                iceSelect.appendChild(opt);
            });
        }

        function calculateCurrentPrice() {
            const drinkName = document.getElementById('drink-select').value;
            const size = document.getElementById('size-select').value;
            const topping = document.getElementById('topping-select').value;
            
            const drink = menuData.find(d => d.name === drinkName);
            if (!drink || !size) return 0;

            let basePrice = drink.prices[size] || 0;
            let toppingPrice = 0;
            if (topping === 'bobo') toppingPrice = 5;
            if (topping === 'jelly') toppingPrice = 10;
            if (topping === 'pudding' || topping === 'foam') toppingPrice = 15;

            return basePrice + toppingPrice;
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            let colleague = document.getElementById('colleague-select').value;
            if (colleague === "自訂輸入 (其他同仁)") {
                colleague = document.getElementById('custom-name-input').value.trim();
                if (!colleague) {
                    alert("請輸入自訂姓名！");
                    return;
                }
            }

            const drinkName = document.getElementById('drink-select').value;
            const size = document.getElementById('size-select').value;
            const sweetness = document.getElementById('sweetness-select').value;
            const iceTemp = document.getElementById('ice-temp-select').value;
            const topping = document.getElementById('topping-select').value;
            const note = document.getElementById('note-input').value.trim();

            const totalPrice = calculateCurrentPrice();
            
            let selfPaidDiff = 0;
            const isSelfPaidOrExtra = note.includes("自費") || note.includes("多訂");
            if (isSelfPaidOrExtra) {
                selfPaidDiff = totalPrice;
            } else {
                selfPaidDiff = Math.max(0, totalPrice - 50);
            }

            const toppingTextMap = {
                'none': '',
                'bobo': '+波霸/小珍珠/混珠($5)',
                'jelly': '+紅豆/黑糖珍珠/椰果/仙草凍($10)',
                'pudding': '+布丁/綠茶凍($15)',
                'foam': '+奶蓋/芝士奶蓋($15)'
            };
            const toppingLabel = toppingTextMap[topping] || '';

            pendingOrderData = {
                id: Date.now(),
                colleague,
                drink: drinkName,
                size,
                sweetness,
                iceTemp,
                topping: toppingLabel,
                note,
                price: totalPrice,
                selfPaidDiff
            };

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <p><strong>訂購人：</strong>${colleague}</p>
                <p><strong>飲品：</strong>${drinkName} (${size})${toppingLabel ? ' ' + toppingLabel : ''}</p>
                <p><strong>糖/冰：</strong>${sweetness} / ${iceTemp}</p>
                <p><strong>備註：</strong>${note || '無'}</p>
                <p class="text-base font-bold text-pink-600 mt-2">價格：$${totalPrice} ${selfPaidDiff > 0 ? `<span class="text-red-500">(需自費 $${selfPaidDiff})</span>` : ''}</p>
            `;

            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function confirmAndSubmitOrder() {
            if (!pendingOrderData) return;
            orders.push(pendingOrderData);
            localStorage.setItem('white_alley_orders', JSON.stringify(orders));
            
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('orderForm').reset();
            document.getElementById('custom-name-input').classList.add('hidden');
            
            alert("訂單送出成功！");
            pendingOrderData = null;
            renderAdminTable();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            let totalPeopleSet = new Set();
            let totalCups = orders.length;
            let totalPriceSum = 0;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">目前尚無任何訂單</td></tr>`;
            } else {
                orders.forEach((o) => {
                    totalPeopleSet.add(o.colleague);
                    totalPriceSum += o.price;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50/50";
                    tr.innerHTML = `
                        <td class="p-2.5 font-medium">${o.colleague}</td>
                        <td class="p-2.5">${o.drink} (${o.size})</td>
                        <td class="p-2.5">${o.sweetness} / ${o.iceTemp} ${o.topping ? '<br><span class="text-xs text-pink-500">' + o.topping + '</span>' : ''}</td>
                        <td class="p-2.5 text-gray-500">${o.note || '-'}</td>
                        <td class="p-2.5 text-right font-bold">$${o.price}</td>
                        <td class="p-2.5 text-right text-red-500 font-semibold">$${o.selfPaidDiff}</td>
                        <td class="p-2.5 text-center">
                            <button onclick="deleteOrder(${o.id})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('stat-people').textContent = totalPeopleSet.size;
            document.getElementById('stat-cups').textContent = totalCups;
            document.getElementById('stat-total').textContent = `$${totalPriceSum}`;
            document.getElementById('admin-badge').textContent = `${totalPeopleSet.size}人 / ${totalCups}杯`;
        }

        function deleteOrder(id) {
            if (confirm("確定要刪除這筆訂單嗎？")) {
                orders = orders.filter(o => o.id !== id);
                localStorage.setItem('white_alley_orders', JSON.stringify(orders));
                renderAdminTable();
            }
        }

        function clearAllOrders() {
            if (confirm("確定要清空所有訂購資訊嗎？此動作無法復原。")) {
                orders = [];
                localStorage.removeItem('white_alley_orders');
                renderAdminTable();
            }
        }

        function exportExcel() {
            if (orders.length === 0) {
                alert("目前沒有任何訂單可供匯出！");
                return;
            }

            const sortedOrders = [...orders].sort((a, b) => a.drink.localeCompare(b.drink, 'zh-Hant'));

            // Tab 1: 店家訂購清單
            let tab1Data = [
                ["飲品", "規格", "甜度", "冰塊溫度", "數量", "金額", "姓名"]
            ];
            let tab1TotalPrice = 0;
            let tab1TotalCups = sortedOrders.length;

            sortedOrders.forEach(o => {
                tab1TotalPrice += o.price;
                tab1Data.push([
                    o.drink,
                    o.size,
                    o.sweetness,
                    o.iceTemp + (o.topping ? ' ' + o.topping : ''),
                    1,
                    o.price,
                    o.colleague
                ]);
            });
            tab1Data.push(["總計", "", "", "", tab1TotalCups, tab1TotalPrice, ""]);

            // Tab 2: 個人收費明細
            let tab2Data = [
                ["姓名", "飲品", "規格", "甜度", "冰塊溫度", "備註", "金額", "自費差額"]
            ];
            let tab2TotalPrice = 0;
            let tab2TotalSelfPaid = 0;

            orders.forEach(o => {
                tab2TotalPrice += o.price;
                tab2TotalSelfPaid += o.selfPaidDiff;
                tab2Data.push([
                    o.colleague,
                    o.drink,
                    o.size,
                    o.sweetness,
                    o.iceTemp + (o.topping ? ' ' + o.topping : ''),
                    o.note || "",
                    o.price,
                    o.selfPaidDiff
                ]);
            });
            tab2Data.push(["總計", "", "", "", "", "", tab2TotalPrice, tab2TotalSelfPaid]);

            const wb = XLSX.utils.book_new();
            const ws1 = XLSX.utils.aoa_to_sheet(tab1Data);
            const ws2 = XLSX.utils.aoa_to_sheet(tab2Data);

            XLSX.utils.book_append_sheet(wb, ws1, "店家訂購清單");
            XLSX.utils.book_append_sheet(wb, ws2, "個人收費明細");

            XLSX.writeFile(wb, "紅吱吱吃吃喝喝揪團訂購總表.xlsx");
        }

        window.onload = init;
    </script>
</body>
</html>
